name: release

# Started by scripts/release.sh in MODUGGAGI/folio, or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: folio tag to release, like v1.2.0
        required: true
      publish:
        description: Upload the GitHub Release and update the cask
        type: boolean
        default: true

permissions: {}
concurrency: release

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  TAG: ${{ inputs.tag }}

jobs:
  # Runs folio's own build code, so it never sees the signing secrets.
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          repository: MODUGGAGI/folio
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.FOLIO_DEPLOY_KEY }}
          persist-credentials: false
      # folio links its Rust core (core/) into the app as a static library; bundle.sh builds it with cargo.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: scripts/bundle.sh
      # ditto keeps the bundle's symlinks and permissions, which upload-artifact alone drops.
      - run: ditto -c -k --keepParent build/Folio.app Folio-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: Folio-unsigned.zip
          retention-days: 1

  # Runs only this repository's code, never folio's.
  sign:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
      - run: ditto -x -k Folio-unsigned.zip .
      - name: Sign and notarize
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/sign-and-notarize.sh Folio.app "${TAG#v}"
      - name: Sign the update for Sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Same version as the framework in folio's Package.swift; the checksum pins the download.
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          attrs="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - Folio.zip)"
          scripts/write-appcast.sh "${TAG#v}" "$attrs" > appcast.xml
          cat appcast.xml
      # Lets a test run (publish off) be downloaded and opened on a Mac.
      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: |
            Folio.zip
            Folio.dmg
            appcast.xml
          retention-days: 3
      - name: Publish release and cask
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" Folio.zip Folio.dmg appcast.xml --title "Folio $version" --notes "앱이 자동으로 업데이트합니다. brew로 설치했다면 brew upgrade --cask folio도 됩니다."
          mkdir -p Casks
          scripts/write-cask.sh "$version" "$(shasum -a 256 Folio.zip | cut -d' ' -f1)" > Casks/folio.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/folio.rb
          git commit -m "chore(cask): folio $version로 갱신"
          git push
